# Snowstorm Lite settings used by the Belgian SNOMED CT demo implementations (example only).
# Snowstorm Lite (Spring Boot) reads ./application.properties and ./config/application.properties from its
# working directory, on top of its built-in defaults. In Docker the working directory is /app: mount this
# file as /app/config/application.properties.

# Admin password for POST /fhir-admin/load-package. The built-in default password is public knowledge, so
# always set your own. Do not commit a real password: the environment variable ADMIN_PASSWORD overrides this value.
admin.password=change-me

# Belgian language reference sets, so that displayLanguage / Accept-Language can use these codes.
# Refset IDs from release_package_information.json of the Belgian Edition. nl-be and fr-be are already in
# the Snowstorm Lite defaults; they are repeated here so the Belgian set is complete in one place.
search.dialect.config.nl-be=31000172101
search.dialect.config.fr-be=21000172104
search.dialect.config.de-be=120961000172108
search.dialect.config.nl-be-gp=701000172104
search.dialect.config.fr-be-gp=711000172101

# Implicit FHIR ConceptMaps (http://snomed.info/sct?fhir_cm=<refset>) in addition to the Snowstorm Lite
# defaults (SAME AS, REPLACED BY, POSSIBLY EQUIVALENT TO, ALTERNATIVE, ICD-10 extended map 447562003, ...).
# They are built when a package is imported: re-import after changing them.
fhir.conceptmap.snomed-implicit.10861000172102=Belgian addition to ICD-10 extended map|http://snomed.info/sct|http://hl7.org/fhir/sid/icd-10|
fhir.conceptmap.snomed-implicit.1186921001=POSSIBLY REPLACED BY|http://snomed.info/sct|http://snomed.info/sct|inexact
fhir.conceptmap.snomed-implicit.1186924009=PARTIALLY EQUIVALENT TO|http://snomed.info/sct|http://snomed.info/sct|inexact
