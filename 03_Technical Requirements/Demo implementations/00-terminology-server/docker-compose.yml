# Local terminology server (LTS) for the demos: two Snowstorm Lite instances ("blue" and "green") behind
# the LTS proxy. EXAMPLE ONLY - adapt ports, memory and secrets to your environment.
#
# Note: the demo itself ran the same three components directly with Java 17 and Node.js (see README.md).
# This compose file describes the same set-up for Docker; it was not part of the recorded demo run.
#
# SNOMED CT content is not included. Load a Belgian Edition release package into an instance after start-up
# (POST /fhir-admin/load-package, see README.md).
#
#   export ADMIN_PASSWORD=...        # Snowstorm Lite admin password (load-package)
#   export PROXY_ADMIN_TOKEN=...     # token for POST /admin/switch on the proxy
#   docker compose up -d
#
# The eHR only uses http://localhost:8090/fhir (the proxy); it never calls blue or green directly.
services:
  blue:
    image: snomedinternational/snowstorm-lite:2.7.0
    command: ["--index.path=lucene-index/data"]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # the import of the Belgian Edition (4 languages) needs a large heap; 1-1.5 GB is enough to serve
      JAVA_TOOL_OPTIONS: -Xmx4g
    volumes:
      - blue-index:/app/lucene-index
      - ./application.properties:/app/config/application.properties:ro
    ports: ["8081:8080"]

  green:
    image: snomedinternational/snowstorm-lite:2.7.0
    command: ["--index.path=lucene-index/data"]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx4g
    volumes:
      - green-index:/app/lucene-index
      - ./application.properties:/app/config/application.properties:ro
    ports: ["8080:8080"]

  lts-proxy:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "lts-proxy.mjs"]
    environment:
      PROXY_PORT: "8090"
      BLUE_URL: http://blue:8080
      GREEN_URL: http://green:8080
      ACTIVE: blue
      STATE_FILE: /state/lts-proxy-state.json
      ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?set PROXY_ADMIN_TOKEN}
    volumes:
      - ./lts-proxy.mjs:/app/lts-proxy.mjs:ro
      - proxy-state:/state
    ports: ["8090:8090"]
    depends_on: [blue, green]

volumes:
  blue-index:
  green-index:
  proxy-state:
